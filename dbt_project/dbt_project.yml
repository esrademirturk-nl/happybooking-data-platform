# ============================================================
# dbt_project.yml
# Goal: DBT project configuration for HappyBooking Gold layer
# Author: Esra Demirturk Duman
# ============================================================

# Neden DBT?
# Silver'dan Gold'a geçişte SQL tabanlı transformasyonlar yapıyoruz.
# DBT ile:
# - Her model ayrı .sql dosyası → okunabilir, test edilebilir
# - Otomatik lineage graph → hangi tablo nereden geliyor
# - Built-in tests: unique, not_null
# - CI/CD ile entegre çalışır

name: 'happybooking'
version: '1.0.0'
config-version: 2

profile: 'happybooking'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  happybooking:
    staging:
      +materialized: view        # Staging = view (hafif, hızlı)
      +schema: staging
    marts:
      +materialized: table       # Marts = table (kalıcı, Power BI için)
      +schema: gold
